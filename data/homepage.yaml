faq:
  title: "Frequently Asked Questions"
  items:
    - question: "How much can my child realistically improve?"
      answer: "Most students improve 200–300+ SAT points or 4–6+ ACT points. Improvement varies by starting score, preparation time, and consistency in sessions."
    - question: "Is tutoring fully online?"
      answer: "Yes. All sessions are online, making it easy for your child to receive the same focused support from anywhere."
    - question: "Do you work with ADHD or test anxiety?"
      answer: "Yes. Cassidy's approach is designed to meet different learning styles and helps students build confidence, pacing, and practical test-day strategies."
    - question: "How is this different from group classes?"
      answer: "This is personalized one-on-one tutoring tailored to your child's skill gaps, needs, timeline, and goals—never a one-size-fits-all program."
    - question: "How many students do you accept?"
      answer: "Cassidy maintains a limited roster so each student receives focused preparation and meaningful support throughout the process."

